services:
  selenium-hub:
    image: selenium/hub:4.15.0
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
    environment:
      - GRID_MAX_SESSION=4

  edge-node:
    image: selenium/node-edge:4.15.0
    depends_on:
      - selenium-hub
    environment:
      - HUB_HOST=selenium-hub
      - HUB_PORT=4444
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    volumes:
      - /dev/shm:/dev/shm

  demo-app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm start

  demo-tests:
    build: .
    depends_on:
      - selenium-hub
      - edge-node
      - demo-app
    environment:
      - SELENIUM_HUB_URL=http://selenium-hub:4444/wd/hub
      - APP_URL=http://demo-app:3000
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "sleep 10 && npm test"
    profiles:
      - testing
